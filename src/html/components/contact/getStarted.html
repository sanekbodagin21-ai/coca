<section class="get-started">
    <div class="container get-started__container">
        <div class="get-started__form-wrapper">
            <h3 class="get-started__form-title heading-h4">Let’s level up your brand</h3>
            <p class="get-started__form-text text-p-medium">You can reach us anytime <a class="get-started__form-link"
                    href="mailto:hellosansbrothers@gmail.com">hellosansbrothers@gmail.com</a></p>
            <form action="" class="get-started__form" novalidate>
                <div class="get-started__form-top">
                    <label class="get-started__form-label">
                        <span class="get-started__form-label-text text-p-small">First name</span>
                        <input class="get-started__form-input text-p-small get-started__form-input--small" required
                            type="text" placeholder="First name" name="first-name" minlength="2">
                        <span class="get-started__form-error"></span>
                    </label>
                    <label class="get-started__form-label">
                        <span class="get-started__form-label-text text-p-small">Last name</span>
                        <input class="get-started__form-input text-p-small get-started__form-input--small" required
                            type="text" placeholder="Last name" name="last-name" minlength="2">
                        <span class="get-started__form-error"></span>
                    </label>
                </div>
                <label class="get-started__form-label">
                    <span class="get-started__form-label-text text-p-small">Email</span>
                    <input class="get-started__form-input text-p-small" type="email" required
                        placeholder="you@company.com" name="email">
                    <span class="get-started__form-error"></span>
                </label>
                <label class="get-started__form-label">
                    <span class="get-started__form-label-text text-p-small">Phone number</span>
                    <input id="phone" class="get-started__form-input text-p-small" required type="tel"
                        pattern="^\+?[0-9\s\-\(\)]{7,}$" placeholder="+1 (555) 000-0000" name="phone-number">
                    <span class="get-started__form-error"></span>
                </label>
                <label class="get-started__form-label">
                    <span class="get-started__form-label-text text-p-small">Message</span>
                    <textarea class="get-started__form-input get-started__form-input-textarea" type="text" minlength="100" required
                        placeholder="Leave us a message..." name="message"></textarea>
                    <span class="get-started__form-error"></span>
                </label>
                <button class="get-started__form-button button-form">Get Started</button>
                <p class="get-started__form-success text-p-default"></p>
            </form>
        </div>
        <img class="get-started__img" src="./assets/images/get-started-img.jpg" width="987" height="885" loading="lazy"
            alt="A woman and a man high-five each other">
    </div>
</section>
